<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio : Josh Lind</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Monaco', monospace;
            background: #1a1a0d;
            color: #ff6b00;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            line-height: 1.4;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 107, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 0, 0.03) 0%, transparent 50%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 107, 0, 0.02) 2px,
                    rgba(255, 107, 0, 0.02) 4px
                );
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 0, 0, 0.1) 30%,
                rgba(0, 0, 0, 0.3) 60%,
                rgba(0, 0, 0, 0.6) 90%,
                rgba(0, 0, 0, 0.8) 100%
            );
            pointer-events: none;
            z-index: -1;
            opacity: var(--fade-opacity, 0);
            transition: opacity 0.1s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            color: #ff6b00;
            border: 2px solid #ff6b00;
            border-radius: 12px;
            padding: 25px;
            background: #2a2a1a;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid #ff6b00;
            border-radius: 8px;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00ff00;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            font-weight: normal;
            color: #ff6b00;
            font-style: normal;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 0 150px 0;
            min-height: 4800px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(
                180deg,
                #ff6b00 0%,
                #00ff00 25%,
                #ff6b00 50%,
                #00ff00 75%,
                #ff6b00 100%
            );
            transform: translateX(-50%);
            box-shadow: 
                0 0 8px #ff6b00,
                inset 0 0 3px rgba(255, 107, 0, 0.5);
        }

        .timeline-item {
            position: absolute;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .timeline-item:nth-child(odd) {
            flex-direction: row;
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        /* Individual project positioning */
        .timeline-item:nth-child(1) { top: 0px; }
        .timeline-item:nth-child(2) { top: 160px; }
        .timeline-item:nth-child(3) { top: 320px; }
        .timeline-item:nth-child(4) { top: 480px; }
        .timeline-item:nth-child(5) { top: 640px; }
        .timeline-item:nth-child(6) { top: 800px; }
        .timeline-item:nth-child(7) { top: 960px; }
        .timeline-item:nth-child(8) { top: 1120px; }
        .timeline-item:nth-child(9) { top: 1280px; }
        .timeline-item:nth-child(10) { top: 1440px; }
        .timeline-item:nth-child(11) { top: 1600px; }
        .timeline-item:nth-child(12) { top: 1760px; }
        .timeline-item:nth-child(13) { top: 1920px; }
        .timeline-item:nth-child(14) { top: 2080px; }
        .timeline-item:nth-child(15) { top: 2240px; }
        .timeline-item:nth-child(16) { top: 2400px; }
        .timeline-item:nth-child(17) { top: 2560px; }
        .timeline-item:nth-child(18) { top: 2720px; }
        .timeline-item:nth-child(19) { top: 2880px; }
        .timeline-item:nth-child(20) { top: 3040px; }
        .timeline-item:nth-child(21) { top: 3200px; }
        .timeline-item:nth-child(22) { top: 3360px; }
        .timeline-item:nth-child(23) { top: 3520px; }
        .timeline-item:nth-child(24) { top: 3680px; }
        .timeline-item:nth-child(25) { top: 3840px; }
        .timeline-item:nth-child(26) { top: 4000px; }
        .timeline-item:nth-child(27) { top: 4160px; }

        .timeline-dot {
            width: 12px;
            height: 12px;
            background: #00ff00;
            border: 2px solid #ff6b00;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 8px #00ff00,
                inset 0 0 4px rgba(0, 255, 0, 0.7);
        }

        /* Dynamic dot sizing based on content richness */
        .timeline-dot.dot-small {
            width: 8px;
            height: 8px;
            border-width: 1px;
        }

        .timeline-dot.dot-medium {
            width: 12px;
            height: 12px;
            border-width: 2px;
        }

        .timeline-dot.dot-large {
            width: 16px;
            height: 16px;
            border-width: 2px;
        }

        .timeline-dot.dot-xlarge {
            width: 20px;
            height: 20px;
            border-width: 3px;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.3);
            transform-origin: center;
            background: #ff6b00;
            border-color: #00ff00;
            box-shadow: 
                0 0 15px #ff6b00,
                inset 0 0 6px rgba(255, 107, 0, 0.8);
        }

        /* Connection lines from dots to cards */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #ff6b00, #00ff00);
            top: 50%;
            z-index: 5;
            transition: all 0.3s ease;
            box-shadow: 0 0 4px #ff6b00;
        }

        .timeline-item:nth-child(odd)::after {
            left: calc(50% + 18px);
        }

        .timeline-item:nth-child(even)::after {
            left: calc(50% - 68px);
        }

        .timeline-item:hover::after {
            background: linear-gradient(90deg, #00ff00, #ff6b00);
            width: 60px;
            box-shadow: 0 0 8px #00ff00;
        }

        .project-card {
            background: transparent;
            border-radius: 0;
            padding: 20px;
            box-shadow: none;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
            min-width: 200px;
            max-width: 380px;
            width: auto;
            height: auto;
            min-height: 80px;
            cursor: pointer;
            margin: 0 50px;
            font-family: 'Courier New', monospace;
        }

        .timeline-item:nth-child(odd) .project-card {
            margin-left: 70px;
            margin-right: 0;
        }

        .timeline-item:nth-child(even) .project-card {
            margin-right: 70px;
            margin-left: 0;
        }

        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 
                0 6px 25px rgba(255, 107, 0, 0.3),
                inset 0 0 15px rgba(0, 0, 0, 0.8);
            background: #2a2a1a;
            border: 1px solid #ff6b00;
            border-radius: 8px;
            z-index: 50;
        }

        .project-card::before {
            display: none;
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 6px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            position: relative;
            text-shadow: 0 0 5px #00ff00;
        }

        .project-type {
            display: block;
            color: #ff6b00;
            padding: 0;
            border: none;
            background: none;
            font-size: 0.75rem;
            margin-bottom: 8px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-style: normal;
            font-family: 'Courier New', monospace;
        }

        .project-year {
            color: #ff6b00;
            font-weight: bold;
            font-size: 0.7rem;
            margin-bottom: 0;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #1a1a0d;
            padding: 2px 6px;
            border: 1px solid #ff6b00;
            border-radius: 4px;
            z-index: 20;
            white-space: nowrap;
            font-style: normal;
        }

        .timeline-item:nth-child(odd) .project-year {
            left: calc(50% + 28px);
        }

        .timeline-item:nth-child(even) .project-year {
            right: calc(50% + 28px);
        }

        .project-summary {
            display: none;
            color: #cccccc;
            line-height: 1.4;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        .project-card:hover .project-summary {
            display: block;
        }

        .project-links {
            display: none;
        }

        .project-card:hover .project-links {
            display: block;
        }

        .project-card:hover .project-links a {
            font-size: 0.7rem;
            padding: 4px 10px;
            margin: 3px 6px 3px 0;
        }

        .project-links a {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b00, #00ff00);
            color: #000000;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            margin: 4px 8px 4px 0;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #ff6b00;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        .project-links a:hover {
            background: linear-gradient(135deg, #00ff00, #ff6b00);
            border-color: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .no-content {
            color: #666;
            font-style: normal;
            font-size: 0.8rem;
        }

        .stats {
            background: #2a2a1a;
            padding: 15px;
            border: 2px solid #ff6b00;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 40px;
            color: #ff6b00;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 
                0 0 15px rgba(255, 107, 0, 0.3),
                inset 0 0 8px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .stats::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #ff6b00;
            border-radius: 6px;
            pointer-events: none;
        }

        .stats h3 {
            margin-bottom: 0;
            text-shadow: 0 0 8px #ff6b00;
            font-weight: bold;
            font-size: 0.9rem;
            font-style: normal;
        }

        .thank-you {
            text-align: center;
            padding: 60px 20px;
            margin-top: 50px;
            margin-bottom: 100px;
            color: #ff6b00;
            font-family: 'Courier New', monospace;
            background: #2a2a1a;
            border: 2px solid #ff6b00;
            border-radius: 10px;
            box-shadow: 
                0 0 15px rgba(255, 107, 0, 0.3),
                inset 0 0 8px rgba(0, 0, 0, 0.5);
            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .thank-you::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #ff6b00;
            border-radius: 6px;
            pointer-events: none;
        }

        .thank-you h3 {
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #00ff00;
            font-size: 1.1rem;
        }

        .thank-you p {
            line-height: 1.6;
            opacity: 0.9;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }
            
            .timeline-item {
                flex-direction: row !important;
            }
            
            .timeline-item:nth-child(even) {
                flex-direction: row !important;
            }
            
            .timeline-dot {
                left: 30px;
            }
            
            .project-card {
                margin-left: 60px !important;
                margin-right: 0 !important;
                width: calc(100% - 80px);
            }
            
            .project-card:hover {
                width: calc(100% - 80px);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Art Portfolio : Josh Lind</h1>
            <p class="subtitle">Interactive installations, digital art, and creative technology</p>
        </header>

        <div class="timeline" id="timeline">
        </div>

        <div class="thank-you">
            <h3>I'm glad you're curious</h3>
            <p>Maybe we should make some wacky stuff?</p>
            <p>Thank you to all my collaborators and co-conspirators.</p>
            <p>Let's get started, I've got a few ideas.</p>
        </div>
    </div>

    <script src="projects.js"></script>
    <script>
        // Render projects function
        function renderProjects() {
            const timeline = document.getElementById('timeline');
            
            projects.forEach(project => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.setAttribute('data-year', project.year);
                
                // Calculate content richness for dot sizing
                const contentScore = calculateContentScore(project);
                const dotSize = getDotSizeClass(contentScore);
                
                // Create timeline dot with dynamic size
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${dotSize}`;
                
                // Create project year display on timeline
                const yearDisplay = document.createElement('div');
                yearDisplay.className = 'project-year';
                yearDisplay.textContent = project.yearRange || project.year;
                
                // Create project card (no size class needed - auto-sizing)
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Project title
                const title = document.createElement('h2');
                title.className = 'project-title';
                title.textContent = project.title;
                
                // Project type
                const type = document.createElement('div');
                type.className = 'project-type';
                type.textContent = project.type;
                
                // Project summary
                const summary = document.createElement('p');
                summary.className = project.noContent ? 'project-summary no-content' : 'project-summary';
                summary.textContent = project.summary;
                
                // Project links
                const linksContainer = document.createElement('div');
                linksContainer.className = 'project-links';
                
                if (project.links) {
                    project.links.forEach(link => {
                        const linkElement = document.createElement('a');
                        linkElement.href = link.url;
                        linkElement.textContent = link.text;
                        linksContainer.appendChild(linkElement);
                    });
                }
                
                // Assemble card
                card.appendChild(title);
                card.appendChild(type);
                card.appendChild(summary);
                if (project.links) {
                    card.appendChild(linksContainer);
                }
                
                // Assemble timeline item
                timelineItem.appendChild(dot);
                timelineItem.appendChild(yearDisplay);
                timelineItem.appendChild(card);
                
                // Add to timeline
                timeline.appendChild(timelineItem);
            });
        }

        // Calculate content richness score
        function calculateContentScore(project) {
            let score = 0;
            
            // Base score for having content
            if (!project.noContent) score += 10;
            
            // Summary length contribution
            if (project.summary) {
                if (project.summary.length > 200) score += 30;
                else if (project.summary.length > 100) score += 20;
                else if (project.summary.length > 50) score += 10;
            }
            
            // Links contribution
            if (project.links) {
                score += project.links.length * 8;
            }
            
            // Year range complexity
            if (project.yearRange && project.yearRange !== project.year) {
                score += 5;
            }
            
            return score;
        }

        // Convert content score to dot size class
        function getDotSizeClass(score) {
            if (score >= 40) return 'dot-xlarge';
            if (score >= 25) return 'dot-large';
            if (score >= 15) return 'dot-medium';
            return 'dot-small';
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            renderProjects();
            handleScrollFade();
        });

        // Handle scroll-based fade effect
        function handleScrollFade() {
            function updateFade() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const documentHeight = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPercent = Math.min(scrollTop / documentHeight, 1);
                
                // Apply fade effect to body::after pseudo-element
                const fadeOpacity = scrollPercent * 0.8; // Max opacity of 0.8
                document.body.style.setProperty('--scroll-fade', fadeOpacity);
                
                // Update CSS custom property for the fade effect
                document.documentElement.style.setProperty('--fade-opacity', fadeOpacity);
            }

            // Update on scroll
            window.addEventListener('scroll', updateFade);
            
            // Initial update
            updateFade();
        }
    </script>
</body>
</html>
