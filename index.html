<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio : Josh Lind</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Monaco', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #00ff41;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 65, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 128, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: #00ff41;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 30px #00ff41;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            font-weight: 300;
            color: #ff0080;
            text-shadow: 0 0 10px #ff0080;
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 30px auto;
            padding: 40px 0;
            min-height: 2200px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #00ff41, #ff0080, #00ffff, #ff0080, #00ff41);
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 
                0 0 10px #00ff41,
                inset 0 0 10px rgba(0, 255, 65, 0.5);
            animation: pulse-timeline 8s ease-in-out infinite alternate;
        }

        @keyframes pulse-timeline {
            0% { box-shadow: 0 0 10px #00ff41, inset 0 0 10px rgba(0, 255, 65, 0.5); }
            100% { box-shadow: 0 0 12px #00ff41, inset 0 0 12px rgba(0, 255, 65, 0.6); }
        }

        .timeline-item {
            position: absolute;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .timeline-item:nth-child(odd) {
            flex-direction: row;
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        /* Individual project positioning */
        .timeline-item:nth-child(1) { top: 0px; }
        .timeline-item:nth-child(2) { top: 80px; }
        .timeline-item:nth-child(3) { top: 160px; }
        .timeline-item:nth-child(4) { top: 240px; }
        .timeline-item:nth-child(5) { top: 320px; }
        .timeline-item:nth-child(6) { top: 400px; }
        .timeline-item:nth-child(7) { top: 480px; }
        .timeline-item:nth-child(8) { top: 560px; }
        .timeline-item:nth-child(9) { top: 640px; }
        .timeline-item:nth-child(10) { top: 720px; }
        .timeline-item:nth-child(11) { top: 800px; }
        .timeline-item:nth-child(12) { top: 880px; }
        .timeline-item:nth-child(13) { top: 960px; }
        .timeline-item:nth-child(14) { top: 1040px; }
        .timeline-item:nth-child(15) { top: 1120px; }
        .timeline-item:nth-child(16) { top: 1200px; }
        .timeline-item:nth-child(17) { top: 1280px; }
        .timeline-item:nth-child(18) { top: 1360px; }
        .timeline-item:nth-child(19) { top: 1440px; }
        .timeline-item:nth-child(20) { top: 1520px; }
        .timeline-item:nth-child(21) { top: 1600px; }
        .timeline-item:nth-child(22) { top: 1680px; }
        .timeline-item:nth-child(23) { top: 1760px; }
        .timeline-item:nth-child(24) { top: 1840px; }
        .timeline-item:nth-child(25) { top: 1920px; }
        .timeline-item:nth-child(26) { top: 2000px; }
        .timeline-item:nth-child(27) { top: 2080px; }

        .timeline-dot {
            width: 16px;
            height: 16px;
            background: #00ff41;
            border: none;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            transition: all 0.6s ease;
            box-shadow: 
                0 0 15px #00ff41,
                inset 0 0 5px rgba(0, 255, 65, 0.8);
        }

        /* Dynamic dot sizing based on content richness */
        .timeline-dot.dot-small {
            width: 12px;
            height: 12px;
            box-shadow: 0 0 10px #00ff41;
        }

        .timeline-dot.dot-medium {
            width: 16px;
            height: 16px;
            box-shadow: 0 0 15px #00ff41;
        }

        .timeline-dot.dot-large {
            width: 22px;
            height: 22px;
            box-shadow: 0 0 20px #00ff41;
        }

        .timeline-dot.dot-xlarge {
            width: 28px;
            height: 28px;
            box-shadow: 0 0 25px #00ff41;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.4);
            transform-origin: center;
            background: #ff0080;
            box-shadow: 
                0 0 30px #ff0080,
                0 0 50px rgba(255, 0, 128, 0.5);
        }

        /* Connection lines from dots to cards */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #00ff41, #00ffff);
            top: 50%;
            z-index: 5;
            transition: all 0.5s ease;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .timeline-item:nth-child(odd)::after {
            left: calc(50% + 20px);
        }

        .timeline-item:nth-child(even)::after {
            right: calc(50% + 20px);
        }

        .timeline-item:hover::after {
            background: linear-gradient(90deg, #ff0080, #00ffff);
            width: 60px;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.8);
        }

        .project-card {
            background: linear-gradient(135deg, #111 0%, #222 50%, #111 100%);
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 
                0 4px 15px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(0, 255, 65, 0.1);
            transition: all 0.4s ease;
            border: 1px solid #00ff41;
            position: relative;
            overflow: hidden;
            min-width: 180px;
            max-width: 350px;
            width: auto;
            height: auto;
            min-height: 70px;
            cursor: pointer;
            margin: 0 40px;
            font-family: 'Courier New', monospace;
        }

        .timeline-item:nth-child(odd) .project-card {
            margin-left: 40px;
            margin-right: 0;
        }

        .timeline-item:nth-child(even) .project-card {
            margin-right: 40px;
            margin-left: 0;
        }

        .project-card:hover {
            transform: scale(1.08);
            transform-origin: center;
            z-index: 100;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.9),
                0 0 30px #00ff41,
                inset 0 1px 0 rgba(0, 255, 65, 0.3);
            border-color: #ff0080;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 50%, #1a1a1a 100%);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00ff41, #ff0080, #00ffff, #ff0080, #00ff41);
            animation: scan 12s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ff41;
            margin-bottom: 4px;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00ff41;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        .project-type {
            display: block;
            color: #888;
            padding: 0;
            border: none;
            background: none;
            font-size: 0.65rem;
            margin-bottom: 6px;
            font-weight: 400;
            text-transform: lowercase;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        .project-year {
            color: #888;
            font-weight: bold;
            font-size: 0.7rem;
            margin-bottom: 0;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.9);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #444;
            z-index: 15;
            white-space: nowrap;
        }

        .timeline-item:nth-child(odd) .project-year {
            left: calc(50% + 60px);
        }

        .timeline-item:nth-child(even) .project-year {
            right: calc(50% + 60px);
        }

        .project-summary {
            display: none;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 8px;
            font-size: 0.7rem;
        }

        .project-card:hover .project-summary {
            display: block;
        }

        .project-links {
            display: none;
        }

        .project-card:hover .project-links {
            display: block;
        }

        .project-card:hover .project-links a {
            font-size: 0.6rem;
            padding: 3px 6px;
            margin: 1px 2px 1px 0;
        }

        .project-links a {
            display: inline-block;
            background: linear-gradient(135deg, #00ff41, #00ffff);
            color: #000;
            padding: 6px 12px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.8rem;
            margin: 2px 4px 2px 0;
            transition: all 0.5s ease;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #00ff41;
        }

        .project-links a:hover {
            background: linear-gradient(135deg, #ff0080, #00ff41);
            box-shadow: 0 0 10px #ff0080;
            transform: scale(1.02);
        }

        .no-content {
            color: #555;
            font-style: italic;
            font-size: 0.9rem;
        }

        .stats {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            color: #00ff41;
            border: 1px solid #00ff41;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.3),
                inset 0 1px 0 rgba(0, 255, 65, 0.1);
        }

        .stats h3 {
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff41;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }
            
            .timeline-item {
                flex-direction: row !important;
            }
            
            .timeline-item:nth-child(even) {
                flex-direction: row !important;
            }
            
            .timeline-dot {
                left: 30px;
            }
            
            .project-card {
                margin-left: 60px !important;
                margin-right: 0 !important;
                width: calc(100% - 80px);
            }
            
            .project-card:hover {
                width: calc(100% - 80px);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Art Portfolio : Josh Lind</h1>
            <p class="subtitle">Interactive installations, digital art, and creative technology</p>
        </header>

        <div class="stats">
            <h3>Check out 30ish creative projects, 2005 to present.</h3>
        </div>

        <div class="timeline" id="timeline">
        </div>
    </div>

    <script src="projects.js"></script>
    <script>
        // Render projects function
        function renderProjects() {
            const timeline = document.getElementById('timeline');
            
            projects.forEach(project => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.setAttribute('data-year', project.year);
                
                // Calculate content richness for dot sizing
                const contentScore = calculateContentScore(project);
                const dotSize = getDotSizeClass(contentScore);
                
                // Create timeline dot with dynamic size
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${dotSize}`;
                
                // Create project year display on timeline
                const yearDisplay = document.createElement('div');
                yearDisplay.className = 'project-year';
                yearDisplay.textContent = project.yearRange || project.year;
                
                // Create project card (no size class needed - auto-sizing)
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Project title
                const title = document.createElement('h2');
                title.className = 'project-title';
                title.textContent = project.title;
                
                // Project type
                const type = document.createElement('div');
                type.className = 'project-type';
                type.textContent = project.type;
                
                // Project summary
                const summary = document.createElement('p');
                summary.className = project.noContent ? 'project-summary no-content' : 'project-summary';
                summary.textContent = project.summary;
                
                // Project links
                const linksContainer = document.createElement('div');
                linksContainer.className = 'project-links';
                
                if (project.links) {
                    project.links.forEach(link => {
                        const linkElement = document.createElement('a');
                        linkElement.href = link.url;
                        linkElement.textContent = link.text;
                        linksContainer.appendChild(linkElement);
                    });
                }
                
                // Assemble card
                card.appendChild(title);
                card.appendChild(type);
                card.appendChild(summary);
                if (project.links) {
                    card.appendChild(linksContainer);
                }
                
                // Assemble timeline item
                timelineItem.appendChild(dot);
                timelineItem.appendChild(yearDisplay);
                timelineItem.appendChild(card);
                
                // Add to timeline
                timeline.appendChild(timelineItem);
            });
        }

        // Calculate content richness score
        function calculateContentScore(project) {
            let score = 0;
            
            // Base score for having content
            if (!project.noContent) score += 10;
            
            // Summary length contribution
            if (project.summary) {
                if (project.summary.length > 200) score += 30;
                else if (project.summary.length > 100) score += 20;
                else if (project.summary.length > 50) score += 10;
            }
            
            // Links contribution
            if (project.links) {
                score += project.links.length * 8;
            }
            
            // Year range complexity
            if (project.yearRange && project.yearRange !== project.year) {
                score += 5;
            }
            
            return score;
        }

        // Convert content score to dot size class
        function getDotSizeClass(score) {
            if (score >= 40) return 'dot-xlarge';
            if (score >= 25) return 'dot-large';
            if (score >= 15) return 'dot-medium';
            return 'dot-small';
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', renderProjects);
    </script>
</body>
</html>
