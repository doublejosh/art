<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio : Josh Lind</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 50%, #000000 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 60% 10%, rgba(255, 255, 255, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 10% 80%, rgba(255, 255, 255, 0.06) 0%, transparent 35%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 100px,
                    rgba(255, 255, 255, 0.04) 100px,
                    rgba(255, 255, 255, 0.04) 101px
                );
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 0, 0, 0.1) 15%,
                rgba(0, 0, 0, 0.25) 30%,
                rgba(0, 0, 0, 0.45) 50%,
                rgba(0, 0, 0, 0.7) 70%,
                rgba(0, 0, 0, 0.85) 85%,
                rgba(0, 0, 0, 0.95) 100%
            );
            pointer-events: none;
            z-index: -1;
            opacity: var(--fade-opacity, 0);
            transition: opacity 0.1s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            backdrop-filter: blur(10px);
        }

        header::before {
            display: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 200;
            letter-spacing: -1px;
            color: #ffffff;
            text-transform: none;
            text-shadow: none;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 1;
            font-weight: 300;
            background: linear-gradient(
                135deg,
                #ff0000, #ff4400, #ff8800, #ffaa00, #ffff00, #aaff00, 
                #55ff00, #00ff00, #00ff55, #00ffaa, #00ffff, #00aaff,
                #0055ff, #0000ff, #4400ff, #8800ff, #aa00ff, #ff00ff,
                #ff00aa, #ff0055, #ff0000, #ff4400, #ff8800
            );
            background-size: 800% 800%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-style: normal;
            margin-bottom: 0;
            letter-spacing: 0.8px;
            text-transform: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            animation: 
                rainbowShift 8s ease-in-out infinite,
                textGlow 4s ease-in-out infinite alternate,
                textFloat 6s ease-in-out infinite,
                textShimmer 3s linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4)) 
                    drop-shadow(0 0 15px rgba(255, 0, 255, 0.3))
                    drop-shadow(0 0 25px rgba(0, 255, 255, 0.2));
            position: relative;
            overflow: visible;
        }

        .subtitle::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.3),
                transparent,
                rgba(255, 255, 255, 0.3)
            );
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerPass 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            15% { background-position: 25% 25%; }
            30% { background-position: 50% 0%; }
            45% { background-position: 75% 25%; }
            60% { background-position: 100% 50%; }
            75% { background-position: 75% 75%; }
            90% { background-position: 25% 100%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes textGlow {
            0% { 
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3)) 
                        drop-shadow(0 0 10px rgba(255, 0, 255, 0.2))
                        drop-shadow(0 0 15px rgba(0, 255, 255, 0.1));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6)) 
                        drop-shadow(0 0 25px rgba(255, 0, 255, 0.4))
                        drop-shadow(0 0 35px rgba(0, 255, 255, 0.3))
                        drop-shadow(0 0 45px rgba(255, 255, 0, 0.2));
                transform: scale(1.03);
            }
            100% { 
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5)) 
                        drop-shadow(0 0 30px rgba(255, 0, 255, 0.3))
                        drop-shadow(0 0 40px rgba(0, 255, 255, 0.2));
                transform: scale(1.01);
            }
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-2px) rotate(0.5deg); }
            50% { transform: translateY(-1px) rotate(0deg); }
            75% { transform: translateY(-3px) rotate(-0.5deg); }
        }

        @keyframes textShimmer {
            0% { 
                text-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.5),
                    0 0 10px rgba(255, 0, 255, 0.3),
                    0 0 15px rgba(0, 255, 255, 0.2);
            }
            33% { 
                text-shadow: 
                    0 0 8px rgba(255, 255, 0, 0.5),
                    0 0 15px rgba(255, 0, 0, 0.3),
                    0 0 20px rgba(0, 255, 0, 0.2);
            }
            66% { 
                text-shadow: 
                    0 0 6px rgba(0, 255, 255, 0.5),
                    0 0 12px rgba(0, 0, 255, 0.3),
                    0 0 18px rgba(255, 255, 255, 0.2);
            }
            100% { 
                text-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.5),
                    0 0 10px rgba(255, 0, 255, 0.3),
                    0 0 15px rgba(0, 255, 255, 0.2);
            }
        }

        @keyframes shimmerPass {
            0% { background-position: -200% 0; opacity: 0; }
            40% { opacity: 0.6; }
            60% { opacity: 0.6; }
            100% { background-position: 200% 0; opacity: 0; }
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 0 150px 0;
            min-height: 4800px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.3),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.05)
            );
            transform: translateX(-50%);
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .timeline-item {
            position: absolute;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .timeline-item:nth-child(odd) {
            flex-direction: row;
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        /* Individual project positioning */
        .timeline-item:nth-child(1) { top: 0px; }
        .timeline-item:nth-child(2) { top: 160px; }
        .timeline-item:nth-child(3) { top: 320px; }
        .timeline-item:nth-child(4) { top: 480px; }
        .timeline-item:nth-child(5) { top: 640px; }
        .timeline-item:nth-child(6) { top: 800px; }
        .timeline-item:nth-child(7) { top: 960px; }
        .timeline-item:nth-child(8) { top: 1120px; }
        .timeline-item:nth-child(9) { top: 1280px; }
        .timeline-item:nth-child(10) { top: 1440px; }
        .timeline-item:nth-child(11) { top: 1600px; }
        .timeline-item:nth-child(12) { top: 1760px; }
        .timeline-item:nth-child(13) { top: 1920px; }
        .timeline-item:nth-child(14) { top: 2080px; }
        .timeline-item:nth-child(15) { top: 2240px; }
        .timeline-item:nth-child(16) { top: 2400px; }
        .timeline-item:nth-child(17) { top: 2560px; }
        .timeline-item:nth-child(18) { top: 2720px; }
        .timeline-item:nth-child(19) { top: 2880px; }
        .timeline-item:nth-child(20) { top: 3040px; }
        .timeline-item:nth-child(21) { top: 3200px; }
        .timeline-item:nth-child(22) { top: 3360px; }
        .timeline-item:nth-child(23) { top: 3520px; }
        .timeline-item:nth-child(24) { top: 3680px; }
        .timeline-item:nth-child(25) { top: 3840px; }
        .timeline-item:nth-child(26) { top: 4000px; }
        .timeline-item:nth-child(27) { top: 4160px; }

        .timeline-dot {
            width: 8px;
            height: 8px;
            background: #0a0a0a;
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        /* Dynamic dot sizing based on content richness */
        .timeline-dot.dot-small {
            width: 6px;
            height: 6px;
            border-width: 1px;
        }

        .timeline-dot.dot-medium {
            width: 8px;
            height: 8px;
            border-width: 2px;
        }

        .timeline-dot.dot-large {
            width: 10px;
            height: 10px;
            border-width: 2px;
        }

        .timeline-dot.dot-xlarge {
            width: 12px;
            height: 12px;
            border-width: 2px;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.2);
            transform-origin: center;
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .timeline-dot.has-links {
            background: linear-gradient(45deg, #ffffff, #f0f0f0, #ffffff);
            background-size: 200% 200%;
            animation: 
                dotPulsate 2s ease-in-out infinite,
                dotShimmer 3s linear infinite,
                dotGlow 1.5s ease-in-out infinite alternate;
            box-shadow: 
                0 0 8px rgba(255, 255, 255, 0.6),
                0 0 15px rgba(255, 255, 255, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
        }

        .timeline-dot.has-links::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transform: rotate(45deg);
            animation: dotSweep 2.5s linear infinite;
        }

        .timeline-dot.has-links:hover {
            background: linear-gradient(45deg, #ffffff, #f8f8f8, #ffffff);
            border-color: #ffffff;
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.8),
                0 0 35px rgba(255, 255, 255, 0.6),
                0 0 45px rgba(255, 255, 255, 0.4),
                inset 0 1px 3px rgba(255, 255, 255, 0.9);
            animation: 
                dotPulsate 1.5s ease-in-out infinite,
                dotShimmer 2s linear infinite,
                dotGlow 1s ease-in-out infinite alternate;
        }

        @keyframes dotPulsate {
            0%, 100% { 
                transform: translateX(-50%) scale(1);
            }
            50% { 
                transform: translateX(-50%) scale(1.05);
            }
        }

        @keyframes dotShimmer {
            0% { 
                background-position: 0% 50%;
            }
            50% { 
                background-position: 100% 50%;
            }
            100% { 
                background-position: 0% 50%;
            }
        }

        @keyframes dotGlow {
            0% {
                box-shadow: 
                    0 0 8px rgba(255, 255, 255, 0.6),
                    0 0 15px rgba(255, 255, 255, 0.4),
                    inset 0 1px 2px rgba(255, 255, 255, 0.8);
            }
            100% {
                box-shadow: 
                    0 0 12px rgba(255, 255, 255, 0.7),
                    0 0 20px rgba(255, 255, 255, 0.5),
                    inset 0 1px 2px rgba(255, 255, 255, 0.9);
            }
        }

        @keyframes dotSweep {
            0% {
                transform: rotate(45deg) translateX(-100%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: rotate(45deg) translateX(100%);
                opacity: 0;
            }
        }

        /* Connection lines from dots to cards */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            top: 50%;
            z-index: 5;
            transition: all 0.3s ease;
            box-shadow: none;
        }

        .timeline-item:nth-child(odd)::after {
            left: calc(50% + 12px);
        }

        .timeline-item:nth-child(even)::after {
            left: calc(50% - 52px);
        }

        .timeline-item:hover::after {
            background: rgba(255, 255, 255, 0.4);
            width: 50px;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .project-card {
            background: transparent;
            border-radius: 0;
            padding: 20px;
            box-shadow: none;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
            min-width: 200px;
            max-width: 380px;
            width: auto;
            height: auto;
            min-height: 80px;
            cursor: pointer;
            margin: 0 50px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInCard 0.6s ease-out forwards;
        }

        @keyframes fadeInCard {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-item:nth-child(odd) .project-card {
            margin-left: 60px;
            margin-right: 0;
        }

        .timeline-item:nth-child(even) .project-card {
            margin-right: 60px;
            margin-left: 0;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .project-card::before {
            display: none;
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.3;
            text-transform: none;
            letter-spacing: 0.3px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            position: relative;
            text-shadow: none;
        }

        .project-type {
            display: block;
            color: #aaaaaa;
            padding: 0;
            border: none;
            background: none;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-style: normal;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }

        .project-year {
            color: #999999;
            font-weight: 300;
            font-size: 0.75rem;
            margin-bottom: 0;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            text-transform: none;
            letter-spacing: 0.5px;
            background: #0a0a0a;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            z-index: 20;
            white-space: nowrap;
            font-style: normal;
        }

        .timeline-item:nth-child(odd) .project-year {
            left: calc(50% + 20px);
        }

        .timeline-item:nth-child(even) .project-year {
            right: calc(50% + 20px);
        }

        .project-summary {
            display: none;
            color: #c8c8c8;
            line-height: 1.5;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }

        .project-card:hover .project-summary {
            display: block;
        }

        .project-links {
            display: none;
        }

        .project-card:hover .project-links {
            display: block;
        }

        .project-card:hover .project-links a {
            font-size: 0.7rem;
            padding: 4px 10px;
            margin: 3px 6px 3px 0;
        }

        .project-links a {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 0.8rem;
            margin: 6px 10px 6px 0;
            transition: all 0.3s ease;
            font-weight: 300;
            text-transform: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 0.3px;
            backdrop-filter: blur(10px);
        }

        .project-links a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1);
        }

        .no-content {
            color: #666;
            font-style: italic;
            font-size: 0.9rem;
        }

        .stats {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            text-align: center;
            margin-bottom: 60px;
            color: #c8c8c8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            text-transform: none;
            letter-spacing: 0.5px;
            box-shadow: none;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .stats::before {
            display: none;
        }

        .stats h3 {
            margin-bottom: 0;
            text-shadow: none;
            font-weight: 300;
            font-size: 1rem;
            font-style: normal;
        }

        .thank-you {
            text-align: center;
            padding: 40px 30px;
            margin-top: 80px;
            margin-bottom: 100px;
            color: #c8c8c8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            box-shadow: none;
            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(10px);
        }

        .thank-you::before {
            display: none;
        }

        .thank-you h3 {
            color: #ffffff;
            text-transform: none;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-shadow: none;
            font-size: 1.5rem;
            font-weight: 300;
        }

        .thank-you p {
            line-height: 1.6;
            opacity: 0.8;
            font-size: 1rem;
            text-transform: none;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }
            
            .timeline-item {
                flex-direction: row !important;
            }
            
            .timeline-item:nth-child(even) {
                flex-direction: row !important;
            }
            
            .timeline-dot {
                left: 30px;
            }
            
            .project-card {
                margin-left: 60px !important;
                margin-right: 0 !important;
                width: calc(100% - 80px);
            }
            
            .project-card:hover {
                width: calc(100% - 80px);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portfolio : Josh Lind</h1>
            <p class="subtitle">Interactive art installations and creative technology</p>
        </header>

        <div class="timeline" id="timeline">
        </div>

        <div class="thank-you">
            <h3>I'm glad you're curious.</h3>
            <p>Maybe we should make some wacky stuff?</p>
            <p>Thank you to collaborators and co-conspirators.</p>
            <p>Let's get started, I've got a few ideas.</p>
        </div>
    </div>

    <script src="projects.js"></script>
    <script>
        // Render projects function
        function renderProjects() {
            const timeline = document.getElementById('timeline');
            
            projects.forEach(project => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.setAttribute('data-year', project.year);
                
                // Calculate content richness for dot sizing
                const contentScore = calculateContentScore(project);
                const dotSize = getDotSizeClass(contentScore);
                
                // Create timeline dot with dynamic size
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${dotSize}`;
                
                // Add has-links class if project has links
                if (project.links && project.links.length > 0) {
                    dot.classList.add('has-links');
                }
                
                // Create project year display on timeline
                const yearDisplay = document.createElement('div');
                yearDisplay.className = 'project-year';
                yearDisplay.textContent = project.yearRange || project.year;
                
                // Create project card (no size class needed - auto-sizing)
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Add staggered animation delay
                const index = projects.indexOf(project);
                card.style.animationDelay = `${index * 0.1}s`;
                
                // Project title
                const title = document.createElement('h2');
                title.className = 'project-title';
                title.textContent = project.title;
                
                // Project type
                const type = document.createElement('div');
                type.className = 'project-type';
                type.textContent = project.type;
                
                // Project summary
                const summary = document.createElement('p');
                summary.className = project.noContent ? 'project-summary no-content' : 'project-summary';
                summary.textContent = project.summary;
                
                // Project links
                const linksContainer = document.createElement('div');
                linksContainer.className = 'project-links';
                
                if (project.links) {
                    project.links.forEach(link => {
                        const linkElement = document.createElement('a');
                        linkElement.href = link.url;
                        linkElement.target = '_blank';
                        linkElement.textContent = link.text;
                        linksContainer.appendChild(linkElement);
                    });
                }
                
                // Assemble card
                card.appendChild(title);
                card.appendChild(type);
                card.appendChild(summary);
                if (project.links) {
                    card.appendChild(linksContainer);
                }
                
                // Assemble timeline item
                timelineItem.appendChild(dot);
                timelineItem.appendChild(yearDisplay);
                timelineItem.appendChild(card);
                
                // Add to timeline
                timeline.appendChild(timelineItem);
            });
        }

        // Calculate content richness score
        function calculateContentScore(project) {
            let score = 0;
            
            // Base score for having content
            if (!project.noContent) score += 10;
            
            // Summary length contribution
            if (project.summary) {
                if (project.summary.length > 200) score += 30;
                else if (project.summary.length > 100) score += 20;
                else if (project.summary.length > 50) score += 10;
            }
            
            // Links contribution
            if (project.links) {
                score += project.links.length * 8;
            }
            
            // Year range complexity
            if (project.yearRange && project.yearRange !== project.year) {
                score += 5;
            }
            
            return score;
        }

        // Convert content score to dot size class
        function getDotSizeClass(score) {
            if (score >= 40) return 'dot-xlarge';
            if (score >= 25) return 'dot-large';
            if (score >= 15) return 'dot-medium';
            return 'dot-small';
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            renderProjects();
            handleScrollFade();
        });

        // Handle scroll-based fade effect
        function handleScrollFade() {
            function updateFade() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const documentHeight = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPercent = Math.min(scrollTop / documentHeight, 1);
                
                // Apply fade effect to body::after pseudo-element
                const fadeOpacity = scrollPercent * 0.8; // Max opacity of 0.8
                document.body.style.setProperty('--scroll-fade', fadeOpacity);
                
                // Update CSS custom property for the fade effect
                document.documentElement.style.setProperty('--fade-opacity', fadeOpacity);
            }

            // Update on scroll
            window.addEventListener('scroll', updateFade);
            
            // Initial update
            updateFade();
        }
    </script>
</body>
