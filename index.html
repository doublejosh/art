            margin: 0 auto;
            padding: 20px;
        }

        header {

            margin-bottom: 40px;
            color: #00ff41;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h1 {

            margin-bottom: 10px;
            text-shadow:

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 30px auto;
            padding: 40px 0;
            min-height: 2200px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #00ff41, #ff0080, #00ffff, #ff0080, #00ff41);
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow:

                inset 0 0 10px rgba(0, 255, 65, 0.5);

        }

        @keyframes pulse-timeline {
            0% { box-shadow: 0 0 10px #00ff41, inset 0 0 10px rgba(0, 255, 65, 0.5); }
            100% { box-shadow: 0 0 12px #00ff41, inset 0 0 12px rgba(0, 255, 65, 0.6); }
        }

        .timeline-item {
            position: absolute;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .timeline-item:nth-child(odd) {
            flex-direction: row;
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .timeline-item:nth-child(2) { top: 80px; }
        .timeline-item:nth-child(3) { top: 160px; }
        .timeline-item:nth-child(4) { top: 240px; }

        .timeline-item:nth-child(10) { top: 720px; }
        .timeline-item:nth-child(11) { top: 800px; }
        .timeline-item:nth-child(12) { top: 880px; }
        .timeline-item:nth-child(13) { top: 960px; }
        .timeline-item:nth-child(14) { top: 1040px; }
        .timeline-item:nth-child(15) { top: 1120px; }
        .timeline-item:nth-child(16) { top: 1200px; }
        .timeline-item:nth-child(17) { top: 1280px; }
        .timeline-item:nth-child(18) { top: 1360px; }
        .timeline-item:nth-child(19) { top: 1440px; }
        .timeline-item:nth-child(20) { top: 1520px; }
        .timeline-item:nth-child(21) { top: 1600px; }
        .timeline-item:nth-child(22) { top: 1680px; }
        .timeline-item:nth-child(23) { top: 1760px; }
        .timeline-item:nth-child(24) { top: 1840px; }
        .timeline-item:nth-child(25) { top: 1920px; }
        .timeline-item:nth-child(26) { top: 2000px; }
        .timeline-item:nth-child(27) { top: 2080px; }

        .timeline-dot {
            width: 16px;
            height: 16px;
            background: #00ff41;
            border: none;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            transition: all 0.6s ease;
            box-shadow: 
                0 0 15px #00ff41,
                inset 0 0 5px rgba(0, 255, 65, 0.8);
        }

        /* Dynamic dot sizing based on content richness */
        .timeline-dot.dot-small {
            width: 12px;
            height: 12px;
            box-shadow: 0 0 10px #00ff41;
        }

        .timeline-dot.dot-medium {
            width: 16px;
            height: 16px;
            box-shadow: 0 0 15px #00ff41;
        }

        .timeline-dot.dot-large {
            width: 22px;
            height: 22px;
            box-shadow: 0 0 20px #00ff41;
        }

        .timeline-dot.dot-xlarge {
            width: 28px;
            height: 28px;
            box-shadow: 0 0 25px #00ff41;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.4);
            background: #ff0080;
            box-shadow: 
                0 0 30px #ff0080,
                0 0 50px rgba(255, 0, 128, 0.5);
        }

        /* Connection lines from dots to cards */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #00ff41, #00ffff);
            top: 50%;
            z-index: 5;
            transition: all 0.5s ease;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .timeline-item:nth-child(odd)::after {
            left: calc(50% + 20px);
        }

        .timeline-item:nth-child(even)::after {
            right: calc(50% + 20px);
        }

        .timeline-item:hover::after {
            background: linear-gradient(90deg, #ff0080, #00ffff);
            width: 60px;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.8);
        }

        .project-card {

            padding: 15px 20px;

            height: auto;

            cursor: pointer;
            margin: 0 40px;
            font-family: 'Courier New', monospace;

            margin-right: 0;
        }

        .timeline-item:nth-child(even) .project-card {
            margin-right: 40px;
            margin-left: 0;
        }

            transform-origin: center;
            z-index: 100;

            background: linear-gradient(135deg, #1a1a1a 0%, #333 50%, #1a1a1a 100%);

            left: 0;

        @keyframes scan {
            0% { transform: translateX(-100%); opacity: 0; }

            font-size: 0.6rem;
            padding: 3px 6px;
            margin: 1px 2px 1px 0;
        }

        .project-links a {
            display: inline-block;
            background: linear-gradient(135deg, #00ff41, #00ffff);
            color: #000;
            padding: 6px 12px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.8rem;
            margin: 2px 4px 2px 0;
            transition: all 0.5s ease;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #00ff41;
        }

        .project-links a:hover {
            background: linear-gradient(135deg, #ff0080, #00ff41);
            box-shadow: 0 0 10px #ff0080;
            transform: scale(1.02);
        }

        .no-content {
            color: #555;
            font-style: italic;
            font-size: 0.9rem;
        }

        .stats {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            color: #00ff41;
            border: 1px solid #00ff41;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow:

        }

            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff41;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }
            
            .timeline-item {
                flex-direction: row !important;
            }
            
            .timeline-item:nth-child(even) {
                flex-direction: row !important;
            }
            
            .timeline-dot {
                left: 30px;
            }
            
            .project-card {
                margin-left: 60px !important;
                margin-right: 0 !important;
                width: calc(100% - 80px);
            }
            
            .project-card:hover {
                width: calc(100% - 80px);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>

                summary: "A string of balloon lanterns, each with a microchipped RGB LED bulb, making them controllable inflatable light bulbs synchronized from an Arduino processor on the ground. The light patterns and simulated motion is done via phone/ethernet cords and connection terminals. This piece has been setup with helium as single vertical chain as well as in a 3D geometric (tetrahedron) array.",
                links: [
                    { text: "Installed #1", url: "http://www.youtube.com/watch?v=B_QpBHy1OX4" },
                    { text: "Installed #2", url: "http://www.youtube.com/watch?v=ka-9o_Phb_I" },
                    { text: "GitHub", url: "https://github.com/doublejosh/balloon_arch" }
                ]
            },
            {
                id: "space-cat-vampire",
                title: "Space Cat Vampire Adventure",
                type: "Board game",
                year: "2011",
                yearRange: "2011-2018",
                summary: "No description available",
                noContent: true
            },
            {
                id: "steve-robot",
                title: "Steve the Robot H.E.Ai.D.",
                type: "interactive audio experience",
                year: "2010",
                summary: "A large-scale, interactive, collaborative audio installation in which people moved to control lasers generate music together. Short for Human Energized Artificial Intelligence Device— the project was intended as a new type of instrument played both as an individual and/or within a group. Because sound was created by simple movement the barrier to participation was low, and emergent collaborative exploration often became the focus.",
                links: [
                    { text: "Making of Steve the Robot", url: "https://www.slideshare.net/slideshow/making-of-steve-the-robot-heaid/3942828" }
                ]
            },
            {
                id: "radioator",
                title: "Radioator",
                type: "mobile broadcast cart",
                year: "2007",
                summary: "A mobile radio station built on a golf cart chassis that broadcast mobile FM (25mW). It allowed vehicles and people to synchronize nearby; sometimes silently using ear phones (50 provided to guests), as well as synchronizing disparate speaker systems. The cart frame was made to look like a giant 12 foot set of headphones in bright chartreuse using two fold-out hemispheres and a connecting arch tubes."
            },
            {
                id: "iheartsea",
                title: "iheartSEA",
                type: "local news aggregator",
                year: "2005",
                summary: "This project was a web platform expressing the unique online voice of different neighborhoods within the Seattle area. As people and businesses voiced their thoughts via their twitter account or blog it would join the stream. (Folks could also create an account directly). At its essence iheartsea.com was a news and chatter aggregator."
            },
            {
                id: "anthropornography",
                title: "Anthropornography",
                type: "faux cologne brand",
                year: "2005",
                summary: "A collaboration with an essential scent business owner, it presented a fantastical brand backstory for a custom-made scent. It was an experiment in alternative packaging for an existing product which supposed an ancient grounding in the human sexual response to the cologne. This includes: web presence, brand, cards, retail display, and product packaging."
            }
        ];

        // Render projects function
        function renderProjects() {
            const timeline = document.getElementById('timeline');
            
            projects.forEach(project => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.setAttribute('data-year', project.year);
                
                // Calculate content richness for dot sizing
                const contentScore = calculateContentScore(project);
                const dotSize = getDotSizeClass(contentScore);
                
                // Create timeline dot with dynamic size
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${dotSize}`;
                
                // Create project year display on timeline
                const yearDisplay = document.createElement('div');
                yearDisplay.className = 'project-year';
                yearDisplay.textContent = project.yearRange || project.year;
                
                // Create project card (no size class needed - auto-sizing)
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Project title
                const title = document.createElement('h2');
                title.className = 'project-title';
                title.textContent = project.title;
                
                // Project type
                const type = document.createElement('div');
                type.className = 'project-type';
                type.textContent = project.type;
                
                // Project summary
                const summary = document.createElement('p');
                summary.className = project.noContent ? 'project-summary no-content' : 'project-summary';
                summary.textContent = project.summary;
                
                // Project links
                const linksContainer = document.createElement('div');
                linksContainer.className = 'project-links';
                
                if (project.links) {
                    project.links.forEach(link => {
                        const linkElement = document.createElement('a');
                        linkElement.href = link.url;
                        linkElement.textContent = link.text;
                        linksContainer.appendChild(linkElement);
                    });
                }
                
                // Assemble card
                card.appendChild(title);
                card.appendChild(type);
                card.appendChild(summary);
                if (project.links) {
                    card.appendChild(linksContainer);
                }
                
                // Assemble timeline item
                timelineItem.appendChild(dot);
                timelineItem.appendChild(yearDisplay);
                timelineItem.appendChild(card);
                
                // Add to timeline
                timeline.appendChild(timelineItem);
            });
        }

        // Calculate content richness score
        function calculateContentScore(project) {
            let score = 0;
            
            // Base score for having content
            if (!project.noContent) score += 10;
            
            // Summary length contribution
            if (project.summary) {
                if (project.summary.length > 200) score += 30;
                else if (project.summary.length > 100) score += 20;
                else if (project.summary.length > 50) score += 10;
            }
            
            // Links contribution
            if (project.links) {
                score += project.links.length * 8;
            }
            
            // Year range complexity
            if (project.yearRange && project.yearRange !== project.year) {
                score += 5;
            }
            
            return score;
        }

        // Convert content score to dot size class
        function getDotSizeClass(score) {
            if (score >= 40) return 'dot-xlarge';
            if (score >= 25) return 'dot-large';
            if (score >= 15) return 'dot-medium';
            return 'dot-small';
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', renderProjects);
    </script>
</body>
</html>
