<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio : Josh Lind</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #fafafa;
            color: #2c2c2c;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, rgba(250, 250, 250, 0.98) 0%, rgba(245, 245, 245, 0.95) 100%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            color: #2c2c2c;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
            font-weight: normal;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.7;
            font-weight: 300;
            color: #666;
            font-style: italic;
            margin-bottom: 20px;
        }

        .timeline {
            position: relative;
            max-width: 900px;
            margin: 60px auto;
            padding: 0 0 200px 0;
            min-height: 2400px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #d0d0d0;
            transform: translateX(-50%);
        }

        .timeline-item {
            position: absolute;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .timeline-item:nth-child(odd) {
            flex-direction: row;
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        /* Individual project positioning */
        .timeline-item:nth-child(1) { top: 0px; }
        .timeline-item:nth-child(2) { top: 80px; }
        .timeline-item:nth-child(3) { top: 160px; }
        .timeline-item:nth-child(4) { top: 240px; }
        .timeline-item:nth-child(5) { top: 320px; }
        .timeline-item:nth-child(6) { top: 400px; }
        .timeline-item:nth-child(7) { top: 480px; }
        .timeline-item:nth-child(8) { top: 560px; }
        .timeline-item:nth-child(9) { top: 640px; }
        .timeline-item:nth-child(10) { top: 720px; }
        .timeline-item:nth-child(11) { top: 800px; }
        .timeline-item:nth-child(12) { top: 880px; }
        .timeline-item:nth-child(13) { top: 960px; }
        .timeline-item:nth-child(14) { top: 1040px; }
        .timeline-item:nth-child(15) { top: 1120px; }
        .timeline-item:nth-child(16) { top: 1200px; }
        .timeline-item:nth-child(17) { top: 1280px; }
        .timeline-item:nth-child(18) { top: 1360px; }
        .timeline-item:nth-child(19) { top: 1440px; }
        .timeline-item:nth-child(20) { top: 1520px; }
        .timeline-item:nth-child(21) { top: 1600px; }
        .timeline-item:nth-child(22) { top: 1680px; }
        .timeline-item:nth-child(23) { top: 1760px; }
        .timeline-item:nth-child(24) { top: 1840px; }
        .timeline-item:nth-child(25) { top: 1920px; }
        .timeline-item:nth-child(26) { top: 2000px; }
        .timeline-item:nth-child(27) { top: 2080px; }

        .timeline-dot {
            width: 8px;
            height: 8px;
            background: #666;
            border: none;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Dynamic dot sizing based on content richness */
        .timeline-dot.dot-small {
            width: 6px;
            height: 6px;
        }

        .timeline-dot.dot-medium {
            width: 8px;
            height: 8px;
        }

        .timeline-dot.dot-large {
            width: 10px;
            height: 10px;
        }

        .timeline-dot.dot-xlarge {
            width: 12px;
            height: 12px;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.5);
            transform-origin: center;
            background: #2c2c2c;
        }

        /* Connection lines from dots to cards */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 1px;
            background: #d0d0d0;
            top: 50%;
            z-index: 5;
            transition: all 0.3s ease;
        }

        .timeline-item:nth-child(odd)::after {
            left: calc(50% + 15px);
        }

        .timeline-item:nth-child(even)::after {
            left: calc(50% - 55px);
        }

        .timeline-item:hover::after {
            background: #999;
            width: 50px;
        }

        .project-card {
            background: transparent;
            border-radius: 0;
            padding: 30px;
            box-shadow: none;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
            min-width: 240px;
            max-width: 420px;
            width: auto;
            height: auto;
            min-height: 120px;
            cursor: pointer;
            margin: 0 60px;
            font-family: 'Georgia', serif;
        }

        .timeline-item:nth-child(odd) .project-card {
            margin-left: 60px;
            margin-right: 0;
        }

        .timeline-item:nth-child(even) .project-card {
            margin-right: 60px;
            margin-left: 0;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
            background: #ffffff;
            z-index: 50;
        }

        .project-card::before {
            display: none;
        }

        .project-title {
            font-size: 1.4rem;
            font-weight: normal;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
            text-transform: none;
            letter-spacing: -0.3px;
            font-family: 'Georgia', serif;
            position: relative;
        }

        .project-type {
            display: block;
            color: #999;
            padding: 0;
            border: none;
            background: none;
            font-size: 0.85rem;
            margin-bottom: 12px;
            font-weight: 300;
            text-transform: none;
            letter-spacing: 0;
            font-style: italic;
            font-family: 'Georgia', serif;
        }

        .project-year {
            color: #999;
            font-weight: 300;
            font-size: 0.8rem;
            margin-bottom: 0;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Georgia', serif;
            text-transform: none;
            letter-spacing: 0;
            background: #fafafa;
            padding: 2px 4px;
            border-radius: 0;
            border: none;
            z-index: 20;
            white-space: nowrap;
            font-style: italic;
        }

        .timeline-item:nth-child(odd) .project-year {
            left: calc(50% + 25px);
        }

        .timeline-item:nth-child(even) .project-year {
            right: calc(50% + 25px);
        }

        .project-summary {
            display: none;
            color: #555;
            line-height: 1.6;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-family: 'Georgia', serif;
        }

        .project-card:hover .project-summary {
            display: block;
        }

        .project-links {
            display: none;
        }

        .project-card:hover .project-links {
            display: block;
        }

        .project-card:hover .project-links a {
            font-size: 0.8rem;
            padding: 6px 16px;
            margin: 4px 8px 4px 0;
        }

        .project-links a {
            display: inline-block;
            background: #f5f5f5;
            color: #2c2c2c;
            padding: 8px 20px;
            border-radius: 0;
            text-decoration: none;
            font-size: 0.85rem;
            margin: 6px 12px 6px 0;
            transition: all 0.3s ease;
            font-weight: 300;
            text-transform: none;
            border: 1px solid #e0e0e0;
            font-family: 'Georgia', serif;
        }

        .project-links a:hover {
            background: #2c2c2c;
            color: #ffffff;
            border-color: #2c2c2c;
        }

        .no-content {
            color: #999;
            font-style: italic;
            font-size: 0.9rem;
        }

        .stats {
            background: transparent;
            padding: 0;
            border-radius: 0;
            text-align: center;
            margin-bottom: 60px;
            color: #666;
            border: none;
            font-family: 'Georgia', serif;
            text-transform: none;
            letter-spacing: 0;
            box-shadow: none;
        }

        .stats h3 {
            margin-bottom: 0;
            text-shadow: none;
            font-weight: 300;
            font-size: 1rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }
            
            .timeline-item {
                flex-direction: row !important;
            }
            
            .timeline-item:nth-child(even) {
                flex-direction: row !important;
            }
            
            .timeline-dot {
                left: 30px;
            }
            
            .project-card {
                margin-left: 60px !important;
                margin-right: 0 !important;
                width: calc(100% - 80px);
            }
            
            .project-card:hover {
                width: calc(100% - 80px);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Art Portfolio : Josh Lind</h1>
            <p class="subtitle">Interactive installations, digital art, and creative technology</p>
        </header>

        <div class="stats">
            <h3>A curated selection of works spanning twenty years, 2005–present.</h3>
        </div>

        <div class="timeline" id="timeline">
        </div>
    </div>

    <script src="projects.js"></script>
    <script>
        // Render projects function
        function renderProjects() {
            const timeline = document.getElementById('timeline');
            
            projects.forEach(project => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.setAttribute('data-year', project.year);
                
                // Calculate content richness for dot sizing
                const contentScore = calculateContentScore(project);
                const dotSize = getDotSizeClass(contentScore);
                
                // Create timeline dot with dynamic size
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${dotSize}`;
                
                // Create project year display on timeline
                const yearDisplay = document.createElement('div');
                yearDisplay.className = 'project-year';
                yearDisplay.textContent = project.yearRange || project.year;
                
                // Create project card (no size class needed - auto-sizing)
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Project title
                const title = document.createElement('h2');
                title.className = 'project-title';
                title.textContent = project.title;
                
                // Project type
                const type = document.createElement('div');
                type.className = 'project-type';
                type.textContent = project.type;
                
                // Project summary
                const summary = document.createElement('p');
                summary.className = project.noContent ? 'project-summary no-content' : 'project-summary';
                summary.textContent = project.summary;
                
                // Project links
                const linksContainer = document.createElement('div');
                linksContainer.className = 'project-links';
                
                if (project.links) {
                    project.links.forEach(link => {
                        const linkElement = document.createElement('a');
                        linkElement.href = link.url;
                        linkElement.textContent = link.text;
                        linksContainer.appendChild(linkElement);
                    });
                }
                
                // Assemble card
                card.appendChild(title);
                card.appendChild(type);
                card.appendChild(summary);
                if (project.links) {
                    card.appendChild(linksContainer);
                }
                
                // Assemble timeline item
                timelineItem.appendChild(dot);
                timelineItem.appendChild(yearDisplay);
                timelineItem.appendChild(card);
                
                // Add to timeline
                timeline.appendChild(timelineItem);
            });
        }

        // Calculate content richness score
        function calculateContentScore(project) {
            let score = 0;
            
            // Base score for having content
            if (!project.noContent) score += 10;
            
            // Summary length contribution
            if (project.summary) {
                if (project.summary.length > 200) score += 30;
                else if (project.summary.length > 100) score += 20;
                else if (project.summary.length > 50) score += 10;
            }
            
            // Links contribution
            if (project.links) {
                score += project.links.length * 8;
            }
            
            // Year range complexity
            if (project.yearRange && project.yearRange !== project.year) {
                score += 5;
            }
            
            return score;
        }

        // Convert content score to dot size class
        function getDotSizeClass(score) {
            if (score >= 40) return 'dot-xlarge';
            if (score >= 25) return 'dot-large';
            if (score >= 15) return 'dot-medium';
            return 'dot-small';
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', renderProjects);
    </script>
</body>
</html>
